<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#F5F1E8"/>
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.14  0 0 0 0 0.13  0 0 0 0.04 0"/>
      </filter>
      <rect width="200" height="200" filter="url(#n)"/>
    </pattern>

    <!-- Vertical hairlines (12-col grid hint) -->
    <pattern id="cols" patternUnits="userSpaceOnUse" width="100" height="630">
      <rect width="100" height="630" fill="url(#grain)"/>
      <line x1="0" y1="0" x2="0" y2="630" stroke="#D8D3C2" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#cols)"/>

  <!-- Top hairline -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#D8D3C2"/>

  <!-- Logo + wordmark (top-left) -->
  <g transform="translate(80,38)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="#F5F1E8" stroke="#1A2421" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="6" fill="#C96442"/>
    <text x="46" y="22" font-family="JetBrains Mono, ui-monospace, Menlo" font-size="16" fill="#1A2421">
      mamba<tspan fill="#C96442">·</tspan>nemotron-agw-adapter
    </text>
  </g>

  <!-- Pill (top-right) -->
  <g transform="translate(1120,52)">
    <rect x="-110" y="-18" width="110" height="32" rx="16" fill="#EFE9DC" stroke="#CDD0C8"/>
    <circle cx="-92" cy="-2" r="3" fill="#3F7D58"/>
    <text x="-82" y="3" font-family="JetBrains Mono, ui-monospace, Menlo" font-size="12" fill="#36433E">
      v0.1.0 · beta
    </text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(80,200)">
    <line x1="0" y1="-6" x2="22" y2="-6" stroke="#2A6E5E" stroke-width="1.5"/>
    <text x="34" y="0" font-family="Inter, system-ui" font-size="14" font-weight="600"
          fill="#2A6E5E" letter-spacing="2">
      AGENT OS · RUN #7 · LLM GATEWAY
    </text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="Source Serif 4, Tiempos, Iowan Old Style, Georgia, serif"
        font-size="120" font-weight="400" fill="#1A2421" letter-spacing="-0.02em">
    Nemotron,
  </text>
  <text x="80" y="440" font-family="Source Serif 4, Tiempos, Iowan Old Style, Georgia, serif"
        font-size="120" font-weight="400" fill="#2A6E5E" letter-spacing="-0.02em" font-style="italic">
    governed.
  </text>

  <!-- Sub-headline -->
  <text x="80" y="495" font-family="Inter, system-ui" font-size="22"
        fill="#36433E">
    OpenAI-compatible upstream for Solo.io Agentgateway · audit, lineage, capability enforcement.
  </text>

  <!-- Bottom hairline -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#D8D3C2"/>

  <!-- Standards strip -->
  <g transform="translate(80,580)" font-family="Inter, system-ui" font-size="13" fill="#6E7570">
    <circle cx="0" cy="-4" r="3" fill="#2A6E5E"/>
    <text x="10" y="0">EU AI Act</text>

    <circle cx="120" cy="-4" r="3" fill="#A66E38"/>
    <text x="130" y="0">NIST AI RMF 1.0</text>

    <circle cx="290" cy="-4" r="3" fill="#2A6E5E"/>
    <text x="300" y="0">ISO/IEC 42001:2023</text>

    <circle cx="475" cy="-4" r="3" fill="#A66E38"/>
    <text x="485" y="0">SOC 2</text>

    <circle cx="555" cy="-4" r="3" fill="#2A6E5E"/>
    <text x="565" y="0">NAIC Model Bulletin</text>
  </g>

  <!-- URL (bottom-right) -->
  <text x="1120" y="585" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo"
        font-size="14" fill="#36433E">
    mamba.taifoon.dev
  </text>
</svg>
