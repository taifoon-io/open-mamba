apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mamba-nemotron-agw-adapter.fullname" . }}
  labels: {{- include "mamba-nemotron-agw-adapter.labels" . | nindent 4 }}
  annotations:
    agentos.io/certificate-ref: {{ required "agentos.certificateRef required" .Values.agentos.certificateRef | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "mamba-nemotron-agw-adapter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mamba-nemotron-agw-adapter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mamba-nemotron-agw-adapter.serviceAccountName" . }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: adapter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TRITON_ENDPOINT
              value: {{ .Values.triton.endpoint | quote }}
            - name: AGENTOS_CERTIFICATE_REF
              value: {{ .Values.agentos.certificateRef | quote }}
            - name: AGENTOS_AUDIT_BUCKET
              value: {{ .Values.agentos.audit.bucket | quote }}
            - name: AGENTOS_LINEAGE_MARQUEZ_URL
              value: {{ .Values.agentos.lineage.marquezUrl | quote }}
            - name: AGENTOS_OTEL_COLLECTOR
              value: {{ .Values.agentos.observability.otelCollector | quote }}
            - name: GUARDRAILS_BEDROCK_ID
              value: {{ .Values.guardrails.bedrockGuardrailId | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: triton-mtls
              mountPath: /etc/triton-tls
              readOnly: true
            - name: opa-bundle
              mountPath: /etc/opa
              readOnly: true
        - name: opa-sidecar
          image: openpolicyagent/opa:0.65.0
          args:
            - "run"
            - "--server"
            - "--addr=127.0.0.1:8181"
            - "--log-level=info"
            - "--bundle"
            - "/bundle"
          volumeMounts:
            - name: opa-bundle
              mountPath: /bundle
              readOnly: true
      volumes:
        - name: triton-mtls
          secret:
            secretName: {{ .Values.triton.tlsSecretRef }}
        - name: opa-bundle
          configMap:
            name: {{ .Values.guardrails.opaBundleConfigMap }}
