apiVersion: v1
kind: Service
metadata:
  name: {{ include "mamba-nemotron-agw-adapter.fullname" . }}
  labels: {{- include "mamba-nemotron-agw-adapter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "mamba-nemotron-agw-adapter.selectorLabels" . | nindent 4 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mamba-nemotron-agw-adapter.fullname" . }}
  labels: {{- include "mamba-nemotron-agw-adapter.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "mamba-nemotron-agw-adapter.selectorLabels" . | nindent 6 }}
