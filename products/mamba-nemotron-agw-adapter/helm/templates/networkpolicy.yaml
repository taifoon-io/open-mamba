{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mamba-nemotron-agw-adapter.fullname" . }}
  labels: {{- include "mamba-nemotron-agw-adapter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mamba-nemotron-agw-adapter.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.agentgatewayNamespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Triton inference server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.tritonNamespace }}
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
    # OTel + Marquez (observability ns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 5000
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
{{- end }}
