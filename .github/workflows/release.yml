name: release

# Triggered by pushing a version tag like `v0.1.0`. Builds open-mamba for
# macOS (Intel + Apple Silicon) and Linux (x86_64 + aarch64), attaches the
# tarballs to the GitHub Release, and opens a PR against
# yawningmonsoon/homebrew-tap with the formula's url + sha256 updated.
#
# Required repo secret:
#   HOMEBREW_TAP_PAT — a fine-grained PAT with `contents:write` and
#                      `pull_requests:write` on yawningmonsoon/homebrew-tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to attach release assets

jobs:
  # ── Build matrix ──────────────────────────────────────────────────────────
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-13,      target: x86_64-apple-darwin       }
          - { os: macos-14,      target: aarch64-apple-darwin      }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu  }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --bin open-mamba --target ${{ matrix.target }}

      - name: package tarball
        id: pack
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          NAME="open-mamba-${VERSION}-${{ matrix.target }}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/scripts"
          cp "target/${{ matrix.target }}/release/open-mamba" "$STAGE/open-mamba"
          cp scripts/mamba                                     "$STAGE/scripts/mamba"
          chmod +x "$STAGE/open-mamba" "$STAGE/scripts/mamba"
          tar -czf "${NAME}.tar.gz" -C "$STAGE" .
          echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: ${{ steps.pack.outputs.asset }}

  # ── Attach all platform tarballs to the GitHub Release ────────────────────
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      source_sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: compute SHA256 of the GitHub source tarball
        id: source
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${VERSION}.tar.gz"
          curl -fsSL "$URL" -o source.tar.gz
          SHA=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source tarball SHA256: $SHA"

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true

  # ── Open a PR against yawningmonsoon/homebrew-tap ─────────────────────────
  bump-tap:
    name: bump tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: checkout tap
        uses: actions/checkout@v4
        with:
          repository: yawningmonsoon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      - name: bump formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA256:  ${{ needs.release.outputs.source_sha256 }}
        run: |
          set -e
          cd tap
          mkdir -p Formula
          # Pull the formula from the open-mamba repo to ensure it's authoritative
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/distribution/homebrew-tap/Formula/open-mamba.rb" -o Formula/open-mamba.rb
          # Replace url + sha256
          sed -i -E "s|^(\s*url\s+)\".*\"|\1\"https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/open-mamba.rb
          sed -i -E "s|^(\s*sha256\s+)\"[^\"]*\"|\1\"${SHA256}\"|" Formula/open-mamba.rb

      - name: open PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          branch: bump/open-mamba-${{ github.ref_name }}
          commit-message: "open-mamba ${{ github.ref_name }}"
          title:          "open-mamba ${{ github.ref_name }}"
          body: |
            Auto-generated by `release.yml` from
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

            - URL points at the source tarball for tag `${{ github.ref_name }}`
            - SHA256 verified against `https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz`

            Merging this PR makes `brew install yawningmonsoon/tap/open-mamba` resolve to ${{ github.ref_name }}.
